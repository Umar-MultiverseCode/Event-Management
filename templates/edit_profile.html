{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
        </div>

        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4">{{ user.bio }}</textarea>
        </div>

        <div class="form-group">
            <label for="profile_picture">Profile Picture</label>
            <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
            <small>Current: {{ user.profile_picture }}</small>
        </div>

        <div class="form-group">
            <label>Preferences</label>
            <div class="preference-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="notifications" {% if user.preferences.notifications %}checked{% endif %}>
                    <span>Enable Notifications</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="email_updates" {% if user.preferences.email_updates %}checked{% endif %}>
                    <span>Email Updates</span>
                </label>
            </div>
        </div>

        <button type="submit">Save Changes</button>
    </form>
</div>

<style>
    .form-container {
        max-width: 600px;
    }

    textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        background-color: var(--input-bg);
        color: var(--text-color);
        resize: vertical;
        min-height: 100px;
    }

    textarea:focus {
        outline: none;
        border-color: #4a90e2;
        box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.1);
    }

    .preference-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        color: var(--text-color);
    }

    .checkbox-label input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    small {
        display: block;
        margin-top: 5px;
        color: #666;
        font-size: 0.8rem;
    }

    input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 2px dashed var(--border-color);
        border-radius: 8px;
        background-color: var(--input-bg);
        color: var(--text-color);
    }

    input[type="file"]:focus {
        outline: none;
        border-color: #4a90e2;
    }
</style>
{% endblock %}
