{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="card">
    <h2>Welcome to Event Management System</h2>
    <p>Here you can manage your events and view upcoming opportunities.</p>
    
    <div style="margin-top: 30px;">
        <h3>Quick Links</h3>
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <a href="{{ url_for('upcoming_events') }}" class="btn">View Upcoming Events</a>
            <a href="{{ url_for('joined_events') }}" class="btn">View Joined Events</a>
        </div>
    </div>
</div>
{% endblock %}
