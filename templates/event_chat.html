{% extends "base.html" %}

{% block title %}Chat - {{ event.title }}{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-header">
        <h1>Event Chat: {{ event.title }}</h1>
        <a href="{{ url_for('event_details', event_id=event.id) }}" class="btn">Back to Event</a>
    </div>

    <div class="chat-messages" id="chat-messages">
        {% for message in messages %}
        <div class="message {% if message.user_id == current_user.id %}own-message{% endif %}">
            <div class="message-header">
                <span class="message-user">{{ message.user.username }}</span>
                <span class="message-time">{{ message.created_at.strftime('%H:%M') }}</span>
            </div>
            <div class="message-content">{{ message.message }}</div>
        </div>
        {% endfor %}
    </div>

    <div class="chat-input-container">
        <div id="typing-indicator" class="typing-indicator"></div>
        <form id="chat-form" class="chat-form">
            <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
            <button type="submit" class="send-button">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>

<style>
    .chat-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 200px);
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .chat-header h1 {
        color: var(--heading-color);
        font-size: 1.8rem;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: var(--card-bg);
        border-radius: 12px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .message {
        max-width: 70%;
        padding: 15px;
        border-radius: 12px;
        background: var(--input-bg);
    }

    .message.own-message {
        align-self: flex-end;
        background: #4a90e2;
        color: white;
    }

    .message-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
        font-size: 0.9rem;
    }

    .own-message .message-header {
        color: rgba(255, 255, 255, 0.8);
    }

    .message-content {
        word-wrap: break-word;
    }

    .chat-input-container {
        position: relative;
    }

    .typing-indicator {
        position: absolute;
        top: -25px;
        left: 0;
        color: var(--secondary-text);
        font-size: 0.9rem;
        height: 20px;
    }

    .chat-form {
        display: flex;
        gap: 10px;
    }

    #message-input {
        flex: 1;
        padding: 15px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        background: var(--input-bg);
        color: var(--text-color);
        font-size: 1rem;
    }

    #message-input:focus {
        outline: none;
        border-color: #4a90e2;
    }

    .send-button {
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0 20px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .send-button:hover {
        background: #357abd;
    }

    @media (max-width: 768px) {
        .chat-container {
            height: calc(100vh - 150px);
            padding: 10px;
        }

        .message {
            max-width: 85%;
        }

        .chat-header {
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    const room = '{{ event.id }}';
    const typingIndicator = document.getElementById('typing-indicator');
    let typingTimeout;

    // Join room
    socket.emit('join', { room: room });

    // Handle incoming messages
    socket.on('chat_message', function(data) {
        const messagesContainer = document.getElementById('chat-messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        messageDiv.innerHTML = `
            <div class="message-header">
                <span class="message-user">${data.user}</span>
                <span class="message-time">${data.timestamp}</span>
            </div>
            <div class="message-content">${data.message}</div>
        `;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    // Handle typing indicators
    socket.on('typing', function(data) {
        typingIndicator.textContent = `${data.user} is typing...`;
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            typingIndicator.textContent = '';
        }, 3000);
    });

    // Handle form submission
    document.getElementById('chat-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const input = document.getElementById('message-input');
        const message = input.value.trim();
        
        if (message) {
            socket.emit('chat_message', {
                room: room,
                message: message
            });
            input.value = '';
        }
    });

    // Handle typing events
    document.getElementById('message-input').addEventListener('input', function() {
        socket.emit('typing', { room: room });
    });
</script>
{% endblock %}
